<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Cloud Drive & Gallery</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --danger-color: #ef4444;
      --success-color: #22c55e;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }

    .btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-danger {
      background-color: var(--danger-color);
    }
    .btn-danger:hover {
      background-color: #dc2626;
    }

    .btn-success {
      background-color: var(--success-color);
    }
    .btn-success:hover {
      background-color: #16a34a;
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
    }
    .btn-outline:hover {
      background-color: var(--border-color);
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .upload-section {
      background-color: var(--card-bg);
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      margin-bottom: 2.5rem;
      transition: border-color 0.2s;
    }

    .upload-section:hover {
      border-color: var(--accent-color);
    }

    .file-input {
      display: none;
    }

    .upload-label {
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .upload-icon {
      font-size: 2.5rem;
    }

    .section-title {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #000;
    }

    .card-body {
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card-title {
      font-size: 0.85rem;
      color: #94a3b8;
      word-break: break-all;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .card-actions .btn {
      flex: 1;
      font-size: 0.8rem;
      padding: 0.4rem;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: #64748b;
      padding: 2rem;
      background-color: var(--card-bg);
      border-radius: 8px;
    }

    /* Modal Styling */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    .modal h2 {
      margin-bottom: 1rem;
    }

    .modal input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: #fff;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .admin-panel {
      border: 2px solid var(--accent-color);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      background-color: rgba(59, 130, 246, 0.05);
      display: none;
    }

    .admin-panel.active {
      display: block;
    }

    .badge {
      background-color: var(--accent-color);
      color: #fff;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: #64748b;
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>📸 Shared Drive</h1>
    <div>
      <button class="btn btn-outline" id="ownerBtn" onclick="openLoginModal()">🔑 Owner Access</button>
      <button class="btn btn-danger" id="logoutBtn" style="display: none;" onclick="logout()">Lock Admin</button>
    </div>
  </header>

  <main>
    <!-- Public Upload Section -->
    <section class="upload-section">
      <label class="upload-label" for="photoInput">
        <span class="upload-icon">📁</span>
        <strong>Click to upload photos</strong>
        <span style="font-size: 0.85rem; color: #94a3b8;">Photos will be submitted for owner authorization before appearing in the public gallery.</span>
      </label>
      <input type="file" id="photoInput" class="file-input" accept="image/*" multiple onchange="handleFileUpload(event)">
    </section>

    <!-- Admin Panel (Only visible to owner when authorized with code 1243) -->
    <section class="admin-panel" id="adminPanel">
      <div class="section-title">
        <h2>🛡️ Owner Approval Panel</h2>
        <span class="badge" id="pendingCount">0 Pending</span>
      </div>
      <div class="grid" id="pendingGrid"></div>
    </section>

    <!-- Public Library Section -->
    <section>
      <div class="section-title">
        <h2>🌐 Public Library</h2>
        <span style="font-size: 0.85rem; color: #94a3b8;" id="publicCount">0 Approved Photos</span>
      </div>
      <div class="grid" id="publicGrid"></div>
    </section>
  </main>

  <!-- Login Modal -->
  <div class="modal-backdrop" id="loginModal">
    <div class="modal">
      <h2>Owner Authorization</h2>
      <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 1rem;">Enter your special password to authorize pending uploads.</p>
      <input type="password" id="passcodeInput" placeholder="Enter Access Code..." onkeydown="if(event.key==='Enter') verifyCode()">
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeLoginModal()">Cancel</button>
        <button class="btn" onclick="verifyCode()">Unlock</button>
      </div>
    </div>
  </div>

  <footer>
    <p>Shared Drive & Public Gallery &bull; GitHub Pages Ready</p>
  </footer>

  <script>
    // Storage keys
    const PUBLIC_KEY = 'shared_drive_public_photos';
    const PENDING_KEY = 'shared_drive_pending_photos';
    const PASSCODE = '1243';

    let isOwner = false;

    // Load photos from localStorage on startup
    window.addEventListener('DOMContentLoaded', () => {
      renderPhotos();
    });

    // Handle photo file selection
    function handleFileUpload(event) {
      const files = event.target.files;
      if (!files.length) return;

      const pendingPhotos = getPhotos(PENDING_KEY);

      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const photoObj = {
            id: Date.now() + Math.random().toString(36).substr(2, 9),
            name: file.name,
            src: e.target.result,
            date: new Date().toLocaleDateString()
          };
          pendingPhotos.push(photoObj);
          savePhotos(PENDING_KEY, pendingPhotos);
          renderPhotos();
        };
        reader.readAsDataURL(file);
      });

      alert('Photo(s) uploaded successfully! Sent to owner for authorization.');
      event.target.value = ''; // Reset input
    }

    // Modal controls
    function openLoginModal() {
      document.getElementById('loginModal').classList.add('active');
      document.getElementById('passcodeInput').focus();
    }

    function closeLoginModal() {
      document.getElementById('loginModal').classList.remove('active');
      document.getElementById('passcodeInput').value = '';
    }

    // Passcode Verification
    function verifyCode() {
      const input = document.getElementById('passcodeInput').value;
      if (input === PASSCODE) {
        isOwner = true;
        document.getElementById('adminPanel').classList.add('active');
        document.getElementById('ownerBtn').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'inline-block';
        closeLoginModal();
        renderPhotos();
      } else {
        alert('Incorrect passcode! Please try again.');
        document.getElementById('passcodeInput').value = '';
      }
    }

    function logout() {
      isOwner = false;
      document.getElementById('adminPanel').classList.remove('active');
      document.getElementById('ownerBtn').style.display = 'inline-block';
      document.getElementById('logoutBtn').style.display = 'none';
      renderPhotos();
    }

    // Approve photo
    function approvePhoto(id) {
      let pendingPhotos = getPhotos(PENDING_KEY);
      let publicPhotos = getPhotos(PUBLIC_KEY);

      const photoToApprove = pendingPhotos.find(p => p.id === id);
      if (photoToApprove) {
        publicPhotos.push(photoToApprove);
        pendingPhotos = pendingPhotos.filter(p => p.id !== id);

        savePhotos(PUBLIC_KEY, publicPhotos);
        savePhotos(PENDING_KEY, pendingPhotos);
        renderPhotos();
      }
    }

    // Reject / Delete photo
    function deletePhoto(id, key) {
      let photos = getPhotos(key);
      photos = photos.filter(p => p.id !== id);
      savePhotos(key, photos);
      renderPhotos();
    }

    // LocalStorage Helpers
    function getPhotos(key) {
      const data = localStorage.getItem(key);
      return data ? JSON.parse(data) : [];
    }

    function savePhotos(key, photos) {
      try {
        localStorage.setItem(key, JSON.stringify(photos));
      } catch (e) {
        alert('Storage quota exceeded! Try uploading smaller or fewer images.');
      }
    }

    // Render photo grids
    function renderPhotos() {
      const pendingPhotos = getPhotos(PENDING_KEY);
      const publicPhotos = getPhotos(PUBLIC_KEY);

      // Render Admin/Pending Grid
      const pendingGrid = document.getElementById('pendingGrid');
      document.getElementById('pendingCount').textContent = `${pendingPhotos.length} Pending`;

      if (pendingPhotos.length === 0) {
        pendingGrid.innerHTML = `<div class="empty-msg">No photos waiting for approval.</div>`;
      } else {
        pendingGrid.innerHTML = pendingPhotos.map(photo => `
          <div class="card">
            <img src="${photo.src}" alt="${photo.name}" />
            <div class="card-body">
              <div class="card-title">${photo.name}</div>
              <div class="card-actions">
                <button class="btn btn-success" onclick="approvePhoto('${photo.id}')">Approve</button>
                <button class="btn btn-danger" onclick="deletePhoto('${photo.id}', '${PENDING_KEY}')">Reject</button>
              </div>
            </div>
          </div>
        `).join('');
      }

      // Render Public Grid
      const publicGrid = document.getElementById('publicGrid');
      document.getElementById('publicCount').textContent = `${publicPhotos.length} Approved Photos`;

      if (publicPhotos.length === 0) {
        publicGrid.innerHTML = `<div class="empty-msg">No photos in the public gallery yet.</div>`;
      } else {
        publicGrid.innerHTML = publicPhotos.map(photo => `
          <div class="card">
            <img src="${photo.src}" alt="${photo.name}" />
            <div class="card-body">
              <div class="card-title">${photo.name}</div>
              ${isOwner ? `
                <div class="card-actions">
                  <button class="btn btn-danger" onclick="deletePhoto('${photo.id}', '${PUBLIC_KEY}')">Delete</button>
                </div>
              ` : ''}
            </div>
          </div>
        `).join('');
      }
    }
  </script>
</body>
</html>
